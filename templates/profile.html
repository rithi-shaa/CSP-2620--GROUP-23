<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Your Profile</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='profile,css') }}">
</head>
<body>
    <div class"profile-card">
        <h2>Your Profile</h2>

        <div class="user-info">
            <p><strong>Username:</strong> {{ user['username'] }}</p>
            <p><strong>Email:</strong> {{ user['email'] }}</p>
        </div>

        <div class="bio-section">
            <h3>Bio</h3>
            
            {% if request.args.get('edit') == 'true' %}
                <form action="/profile" method="POST">
                    <textarea name="bio" rows="4" placeholder="Write something about yourself here...">{{ user.bio if user.bio else ''}}</textarea>
                    <button type="submit">Save Bio</button>
                </form>
            {% else %}
                <p class="bio-text">
                    {{ user.bio if user.bio else "No bio written yet."}}
                </p>
                <a href="/profile?edit=true" class="edit-btn">Edit Bio</a>
            {% endif %}
        </div>

        <div class="nav-links">
            <a href="/shelves">Back to Shelves</a>
            <a href="/logout">Logout</a>
        </div>
    </div>
</body>
</html>
