<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'catalog/style.css' %}">
</head>
<body class="book-background-plain">
    <div class="admin-container">
    <h1>Admin Dashboard</h1>

    <div class="stats-container">
        <p><strong>Total Books:</strong> {{ total_books }}</p>
        <p><strong>Total Users:</strong> {{ total_users }}</p>
    </div>

    <nav>
        <a href="{% url 'add_book' %}">Add Book</a>
        <a href="{% url 'logout' %}">Logout</a>
    </nav>

    <h2>Recent Login History</h2>
    <ul>
        {% for log in login_logs %}
            <li>{{ log.user.username }} logged in at {{ log.login_time }}</li>
        {% empty %}
            <li>No login history found.</li>
        {% endfor %}
    </ul>
    </div>
</body>
</html>
