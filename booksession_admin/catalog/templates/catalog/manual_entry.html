<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manual Book Entry</title>
</head>
<body>
    <h1>Manual Book Entry</h1>
    <form method="POST">
        {% csrf_token %}
        <label>Title:</label><br>
        <input type="text" name="title" required><br><br>
        
        <label>Author(s):</label><br>
        <input type="text" name="authors"><br><br>
        
        <label>Published Date:</label><br>
        <input type="date" name="published_date"><br><br>
        
        <button type="submit">Save Book</button>
    </form>
    <br>
    <a href="{% url 'admin_home' %}">Back to Home</a>
</body>
</html>
