<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - Booksession</title>
</head>
<body>
    <h2>Welcome, {{ request.user.username }}</h2>
    <a href="{% url 'admin_catalog' %}">Book Catalog</a>

    <h3>User Login History</h3>
    <table border="1">
        <tr>
            <th>Username</th>
            <th>Email</th>
            <th>Login Time</th>
        </tr>
        {% for log in logs %}
        <tr>
            <td>{{ log.username }}</td>
            <td>{{ log.email }}</td>
            <td>{{ log.login_time|date:"M d, Y - h:i A" }}</td>
        </tr>
        {% empty %}
        <tr><td colspan="3">No logins recorded yet.</td></tr>
        {% endfor %}
    </table>
</body>
</html>
