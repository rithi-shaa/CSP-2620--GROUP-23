<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Delete Reading Log - Booksession</title>

    {% load static %}

    <link rel="stylesheet" href="{% static 'catalog/style.css' %}">
    <link rel="stylesheet" href="{% static 'catalog/reading_log.css' %}">
    <link rel="stylesheet" href="{% static 'catalog/reading_goal.css' %}">
</head>

<body>

<div class="reading-container">

    <div class="confirmation-card">

        <h1>Delete Reading Log?</h1>

        <p>
            Are you sure you want to delete this reading log?
        </p>

        <div class="delete-info">

            <p>
                <strong>Book:</strong>
                {{ log.book.title }}
            </p>

            <p>
                <strong>Date:</strong>
                {{ log.log_date|date:"d M Y" }}
            </p>

            <p>
                <strong>Pages:</strong>
                {{ log.pages_read }}
            </p>

        </div>

        <form method="POST">

            {% csrf_token %}

            <button type="submit" class="danger-btn">
                Yes, Delete
            </button>

            <a
                href="{% url 'reading_log_list' %}"
                class="secondary-btn"
            >
                Cancel
            </a>

        </form>

    </div>

</div>

</body>
</html>
