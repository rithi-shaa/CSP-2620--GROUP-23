<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Booksession</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'catalog/style.css' %}">
</head>
<body class="book-background">

    <div class="login-card">
        <h2>Login</h2>

        {% if messages %}
            <ul class="flash-messages">
                {% for message in messages %}
                <li>{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}

        <form method="POST" action="{% url 'user_login' %}">
    {% csrf_token %}
    <div class="input-wrapper">
        <input type="text" name="username" placeholder="Username" required>
        <span class="input-icon">👤</span>
    </div>
    <div class="input-wrapper">
        <input type="password" name="password" id="password" placeholder="Password" required>
        <span class="input-icon toggle-password" onclick="togglePassword()">👁️</span>
    </div>

    <div class="form-options">
        <label><input type="checkbox" name="remember"> Remember me</label>
        <a href="{% url 'reset_password' %}" class="forgot-link">Forgot password?</a>
    </div>

    <button type="submit" class="submit-btn">Login</button>
</form>

<script>
function togglePassword() {
    const passwordInput = document.getElementById('password');
    const icon = document.querySelector('.toggle-password');

    if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        icon.textContent = '🙈';
    } else {
        passwordInput.type = 'password';
        icon.textContent = '👁️';
    }
}
</script>

        <p class="register-link"><a href="{% url 'user_register' %}">Don't have an account? Register</a></p>
        <p class="admin-link-text"><a href="{% url 'admin_login' %}">Are you an admin? Log in here</a></p>
    </div>

</body>
</html>
