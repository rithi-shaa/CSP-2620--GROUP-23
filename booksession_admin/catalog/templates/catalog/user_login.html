<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Booksession</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'catalog/style.css' %}">
</head>
<body class="book-background">

    <div class="login-card">
        <h2>Login</h2>

        {% if messages %}
            <ul class="flash-messages">
                {% for message in messages %}
                <li>{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}

        <form method="POST" action="{% url 'user_login' %}">
            {% csrf_token %}
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>

            <div class="form-options">
                <label><input type="checkbox" name="remember"> Remember me</label>
                <a href="{% url 'reset_password' %}" class="forgot-link">Forgot password?</a>
            </div>

            <button type="submit" class="submit-btn">Login</button>
        </form>

        <p class="register-link"><a href="{% url 'user_register' %}">Don't have an account? Register</a></p>
        <p class="admin-link-text"><a href="{% url 'admin_login' %}">Are you an admin? Log in here</a></p>
    </div>

</body>
</html>
