<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Login - Booksession</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'catalog/style.css' %}">
</head>
<body class="book-background">

    <div class="login-card">
        <h2>Admin Login</h2>

        {% if messages %}
            <dic class="flash-messages">
                {% for message in messages %}
                <div class="flash-messages">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}

        <form method="POST" action="{% url 'admin_login' %}">
            {% csrf_token %}
    <div class="input-wrapper">
        <input type="text" name="username" placeholder="Username" required>
        <span class="input-icon">👤</span>
    </div>
    <div class="input-wrapper">
        <input type="password" name="password" id="password" placeholder="Password" required>
        <span class="input-icon toggle-password" onclick="togglePassword()">👁️</span>
    </div>
            <button type="submit" class="submit-btn">Login</button>
        </form>
    
<script>
function togglePassword() {
    const passwordInput = document.getElementById('password');
    const icon = document.querySelector('.toggle-password');

    if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        icon.textContent = '🙈';
    } else {
        passwordInput.type = 'password';
        icon.textContent = '👁️';
    }
}
</script>

        <p class="admin-link-text">Not an admin? <a href="{% url 'user_login' %}">Go to user login</a></p>
    </div>

</body>
</html>
