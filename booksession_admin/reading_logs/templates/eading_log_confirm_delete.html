{% extends 'reading_logs/base.html' %}

{% block content %}

<div class="reading-logs-container">

    <h1>Delete Reading Log</h1>

    <p>
        Are you sure you want to delete this reading log?
    </p>

    <p>
        <strong>Book:</strong>
        {{ log.book.title }}
    </p>

    <p>
        <strong>Pages Read:</strong>
        {{ log.pages_read }}
    </p>

    <form method="POST">

        {% csrf_token %}

        <button type="submit">
            Yes, Delete
        </button>

        <a href="{% url 'reading_logs' %}">
            Cancel
        </a>

    </form>

</div>

{% endblock %}
